<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading room · Book Rooms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body class="room">
  <div class="sky" aria-hidden="true"></div>
  <div class="candles" aria-hidden="true">
    <span class="candle"></span><span class="candle"></span><span class="candle"></span>
    <span class="candle"></span><span class="candle"></span><span class="candle"></span>
  </div>
  <header class="topbar">
    <a href="/" class="brand"><span aria-hidden="true">⚡</span> Book Rooms</a>
    <div class="room-title">
      <strong id="roomName">Loading…</strong>
      <span class="code">Code: <b id="roomCode"></b></span>
    </div>
    <div class="actions">
      <button class="btn small theme-toggle" data-theme-toggle type="button"></button>
      <button id="inviteBtn" class="btn small">🦉 Send invite</button>
      <label class="btn small primary upload-btn">
        📜 Upload PDF
        <input id="pdfInput" type="file" accept="application/pdf,.pdf" hidden>
      </label>
      <button id="sidebarToggle" class="btn small sidebar-toggle" aria-label="Show people and chat">💬</button>
    </div>
  </header>

  <div class="layout">
    <main class="stage">
      <div id="empty" class="empty">
        <div class="empty-book">📚</div>
        <h2>The table is empty</h2>
        <p>Upload a PDF and it will appear as a book for everyone in the room.</p>
      </div>

      <div id="loading" class="loading" hidden>
        <div class="spinner"></div>
        <p id="loadingText">Opening book…</p>
      </div>

      <div id="bookWrap" class="book-wrap" hidden>
        <div id="book" class="book"></div>
      </div>

      <nav id="controls" class="controls" hidden>
        <button id="prevBtn" class="btn round" aria-label="Previous page">‹</button>
        <span id="pageInfo" class="page-info"></span>
        <button id="nextBtn" class="btn round" aria-label="Next page">›</button>
        <label class="follow" title="When on, you turn pages together with everyone in the room">
          <input id="followToggle" type="checkbox" checked> Read together
        </label>
      </nav>
    </main>

    <aside id="sidebar" class="sidebar">
      <section>
        <h3>In the common room <span id="memberCount" class="count"></span></h3>
        <ul id="members" class="members"></ul>
      </section>
      <section class="chat">
        <h3>Whispers</h3>
        <ul id="messages" class="messages"></ul>
        <form id="chatForm" class="chat-form">
          <input id="chatInput" maxlength="500" placeholder="Whisper something…" autocomplete="off">
          <button class="btn small primary">Send</button>
        </form>
      </section>
    </aside>
  </div>

  <div id="joinDialog" class="overlay" hidden>
    <form id="joinForm" class="dialog">
      <h2>Join <span id="joinRoomName">this room</span></h2>
      <label class="field">
        <span>Your name</span>
        <input id="joinName" maxlength="30" required>
      </label>
      <label class="field" id="joinPasswordField" hidden>
        <span>Room password</span>
        <input id="joinPassword" type="password" maxlength="60">
      </label>
      <p id="joinError" class="error"></p>
      <button class="btn primary">Join</button>
    </form>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/vendor/page-flip/page-flip.browser.js"></script>
  <script type="module" src="/js/room.js"></script>
</body>
</html>
